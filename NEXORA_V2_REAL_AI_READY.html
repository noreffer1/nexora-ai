<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA AI Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #e2e8f0;
            --danger: #dc2626;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar / Dashboard */
        .dashboard {
            position: fixed;
            top: 0;
            left: -320px;
            width: 320px;
            height: 100%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: left 0.3s ease;
        }

        .dashboard.show {
            left: 0;
        }

        .dash-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .dash-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .dash-section {
            margin-bottom: 25px;
        }

        .dash-section h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }

        .history-item, .fav-item {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .history-item:hover, .fav-item:hover {
            border-color: var(--accent);
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background-color: var(--card-bg);
        }

        .header-left, .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .output-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto 20px auto;
            border-radius: 12px;
        }

        textarea {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            resize: none;
            height: 50px;
            font-size: 1rem;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- Dashboard Sidebar -->
    <div id="dashboard" class="dashboard">
        <div class="dash-header">
            <h2>NEXORA Dashboard</h2>
            <button id="closeDash" class="btn btn-secondary">✕</button>
        </div>
        <div class="dash-body">
            <div class="dash-section">
                <h3>Profile</h3>
                <div id="profileInfo" class="history-item">User Profile Active</div>
            </div>
            <div class="dash-section">
                <h3>History</h3>
                <div id="historyList"></div>
            </div>
            <div class="dash-section">
                <h3>Favorites</h3>
                <div id="favoritesList"></div>
            </div>
            <div class="dash-section">
                <h3>Settings</h3>
                <button id="motionBtn" class="btn btn-secondary" style="width: 100%; margin-bottom: 10px;">Motion: OFF</button>
                <button id="clearAll" class="btn" style="background-color: var(--danger); width: 100%;">Clear All Data</button>
            </div>
        </div>
    </div>

    <!-- Main Application Interface -->
    <div class="main-container">
        <header>
            <div class="header-left">
                <button id="dashBtn" class="btn btn-secondary">☰ Menu</button>
                <h1>NEXORA AI</h1>
            </div>
            <div class="header-right">
                <button id="clearChat" class="btn btn-secondary">New Chat</button>
            </div>
        </header>

        <div class="chat-container">
            <div id="output" class="output-box">Ready. Ask NEXORA something.</div>
            <div class="action-bar">
                <button id="copy" class="btn btn-secondary">Copy</button>
                <button id="fav" class="btn btn-secondary">♥ Save</button>
            </div>
        </div>

        <div class="input-area">
            <textarea id="prompt" placeholder="Type your prompt here... (Press Ctrl + Enter to send)"></textarea>
            <button id="ask" class="btn">SEND</button>
        </div>
    </div>

    <script>
        const KEY = "NEXORA_DATA_STORE";
        const API_URL = "/api/ai"; // Default backend API endpoint as seen in code

        function getData() {
            const stored = localStorage.getItem(KEY);
            if (!stored) {
                return {
                    settings: { motion: false },
                    history: [],
                    favorites: []
                };
            }
            try {
                return JSON.parse(stored);
            } catch (e) {
                return { settings: { motion: false }, history: [], favorites: [] };
            }
        }

        function saveData(data) {
            localStorage.setItem(KEY, JSON.stringify(data));
        }

        function updateProfile() {
            const data = getData();
            document.getElementById("profileInfo").textContent = "Active Profile | History: " + data.history.length + " | Favs: " + data.favorites.length;
        }

        function renderHistory() {
            const data = getData();
            const container = document.getElementById("historyList");
            container.innerHTML = "";
            data.history.slice(-10).reverse().forEach(item => {
                const div = document.createElement("div");
                div.className = "history-item";
                div.textContent = item.prompt;
                div.onclick = () => {
                    document.getElementById("prompt").value = item.prompt;
                    document.getElementById("output").textContent = item.response;
                    lastPrompt = item.prompt;
                    lastResponse = item.response;
                    document.getElementById("dashboard").classList.remove("show");
                };
                container.appendChild(div);
            });
        }

        function renderFavorites() {
            const data = getData();
            const container = document.getElementById("favoritesList");
            container.innerHTML = "";
            data.favorites.forEach(item => {
                const div = document.createElement("div");
                div.className = "fav-item";
                div.textContent = item.prompt;
                div.onclick = () => {
                    document.getElementById("prompt").value = item.prompt;
                    document.getElementById("output").textContent = item.response;
                    lastPrompt = item.prompt;
                    lastResponse = item.response;
                    document.getElementById("dashboard").classList.remove("show");
                };
                container.appendChild(div);
            });
        }

        function checkAI() {
            console.log("NEXORA AI Initialized.");
        }

        /* INITIALIZE */
        function init(){
            const data = getData();
            let motion = data.settings.motion;
            document.getElementById("motionBtn").textContent = motion ? "Motion: ON" : "Motion: OFF";
            updateProfile();
            renderHistory();
            renderFavorites();
            checkAI();
        }

        init();

        /* GLOBAL ERROR HANDLING */
        window.addEventListener("error", function(event){
            console.error("NEXORA global error:", event.error || event.message);
        });

        window.addEventListener("unhandledrejection", function(event){
            console.error("NEXORA promise error:", event.reason);
        });

        /* DASHBOARD */
        const dashboard = document.getElementById("dashboard");

        document.getElementById("dashBtn").onclick = function(){
            dashboard.classList.add("show");
            updateProfile();
            renderHistory();
            renderFavorites();
        };

        document.getElementById("closeDash").onclick = function(){
            dashboard.classList.remove("show");
        };

        /* CLEAR ALL LOCAL DATA */
        document.getElementById("clearAll").onclick = function(){
            const ok = confirm("Delete all NEXORA local data including profile, history and favorites?");
            if(!ok){
                return;
            }
            localStorage.removeItem(KEY);
            localStorage.removeItem("NEXORA_THEME");
            location.reload();
        };

        /* CLEAR CHAT */
        document.getElementById("clearChat").onclick = function(){
            document.getElementById("prompt").value = "";
            document.getElementById("output").textContent = "Ready. Ask NEXORA something.";
            lastPrompt = "";
            lastResponse = "";
        };

        /* MOTION */
        document.getElementById("motionBtn").onclick = function(){
            const data = getData();
            motion = !motion;
            data.settings.motion = motion;
            saveData(data);
            this.textContent = motion ? "Motion: ON" : "Motion: OFF";
        };

        /* AI REQUEST */
        let lastPrompt = "";
        let lastResponse = "";

        async function askAI(){
            const prompt = document.getElementById("prompt").value.trim();
            const output = document.getElementById("output");
            const button = document.getElementById("ask");

            if(!prompt){
                output.textContent = "Please write something first.";
                return;
            }

            button.disabled = true;
            button.textContent = "THINKING...";
            output.textContent = "NEXORA is thinking...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                let result;
                try {
                    result = await response.json();
                } catch(err) {
                    result = {};
                }

                if(!response.ok){
                    throw new Error(result.error || result.message || ("Server returned HTTP " + response.status));
                }

                const answer = result.response || result.reply || result.answer || result.message || result.output;

                if(!answer){
                    throw new Error("Backend returned an empty response.");
                }

                lastPrompt = prompt;
                lastResponse = String(answer);
                output.textContent = lastResponse;

                /* SAVE HISTORY */
                const data = getData();
                data.history.push({
                    prompt: prompt,
                    response: lastResponse,
                    time: new Date().toLocaleString()
                });

                if(data.history.length > 100){
                    data.history = data.history.slice(-100);
                }

                saveData(data);
                renderHistory();

            } catch(error) {
                console.error("NEXORA AI error:", error);
                output.textContent = "⚠️ NEXORA could not connect to the AI backend.\n\n" + error.message + "\n\nCheck that your Render service is running and that /api/ai is available.";
            } finally {
                button.disabled = false;
                button.textContent = "SEND";
            }
        }

        /* SEND BUTTON */
        document.getElementById("ask").onclick = askAI;

        /* ENTER / CTRL + ENTER */
        document.getElementById("prompt").addEventListener("keydown", function(e){
            if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
                e.preventDefault();
                askAI();
            }
        });

        /* COPY RESPONSE */
        document.getElementById("copy").onclick = async function(){
            const text = document.getElementById("output").textContent;
            if(!text || text === "Ready. Ask NEXORA something."){
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                const original = this.textContent;
                this.textContent = "Copied ✓";
                setTimeout(() => {
                    this.textContent = original;
                }, 1500);
            } catch(error) {
                alert("Copy failed. Please copy manually.");
            }
        };

        /* FAVORITE */
        document.getElementById("fav").onclick = function(){
            if(!lastPrompt || !lastResponse){
                alert("Ask NEXORA something first.");
                return;
            }

            const data = getData();
            const exists = data.favorites.some(item => item.prompt === lastPrompt && item.response === lastResponse);

            if(exists){
                alert("This response is already saved.");
                return;
            }

            data.favorites.push({
                prompt: lastPrompt,
                response: lastResponse,
                time: new Date().toLocaleString()
            });

            if(data.favorites.length > 100){
                data.favorites = data.favorites.slice(-100);
            }

            saveData(data);
            renderFavorites();

            const original = this.textContent;
            this.textContent = "♥ Saved";
            setTimeout(() => {
                this.textContent = original;
            }, 1500);
        };
    </script>
</body>
</html>
